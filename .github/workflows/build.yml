name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          echo "GRADLE=$PWD/gradle-8.0/bin/gradle" >> $GITHUB_ENV
      - name: Build Debug APK
        run: $GRADLE assembleDebug --stacktrace
      - name: Split and commit APK
        run: |
          rm -rf apkbin
          mkdir -p apkbin
          split -b 600000 app/build/outputs/apk/debug/app-debug.apk apkbin/part_
          cd apkbin
          i=0
          for f in part_*; do
            base64 -w0 "$f" > "b64_$i.txt"
            rm -f "$f"
            i=$((i+1))
          done
          echo "COUNT=$i" >> $GITHUB_ENV
          ls -l
          cd ..
          git config user.email "ci@github.com"
          git config user.name "CI"
          git add -A apkbin
          git commit -m "APK chunks $i" || echo "no change"
          git push
