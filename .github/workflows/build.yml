name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          echo "GRADLE=$PWD/gradle-8.0/bin/gradle" >> $GITHUB_ENV
      - name: Build Debug APK
        run: $GRADLE assembleDebug --stacktrace
      - name: Upload APK chunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf chunks && mkdir -p chunks
          split -b 600000 app/build/outputs/apk/debug/app-debug.apk chunks/part_
          python3 scripts/upload_chunks.py
